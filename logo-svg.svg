<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradientes institucionales -->
    <linearGradient id="circuloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388e3c" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="cerroFondo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>
    <linearGradient id="cerroFrente" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
  </defs>

  <!-- Círculo exterior e interior -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#circuloGrad)" stroke-width="12" />
  <circle cx="200" cy="200" r="175" fill="#ffffff" />

  <!-- Grupo central: Montañas y Yungas -->
  <g transform="translate(80, 55)">
    <!-- Cerro del fondo (más claro y alto) -->
    <path d="M 120 20 L 210 135 H 30 Z" fill="url(#cerroFondo)" />
    
    <!-- Cerro delantero principal (capas de yungas) -->
    <path d="M 30 35 L 110 135 H -10 Z" fill="url(#cerroFrente)" />
    <path d="M 90 60 L 160 135 H 20 Z" fill="#2e7d32" opacity="0.85" />

    <!-- Líneas topográficas / senderos sutiles sobre las montañas -->
    <path d="M 125 90 L 140 105 L 130 115" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Símbolo minimalista de geolocalización / pin en la cumbre principal -->
    <path d="M 120 32 C 112 32, 106 38, 106 46 C 106 56, 120 68, 120 68 C 120 68, 134 56, 134 46 C 134 38, 128 32, 120 32 Z" fill="#d32f2f" />
    <circle cx="120" cy="45" r="3.5" fill="#ffffff" />

    <!-- Tierra base / horizonte inferior -->
    <path d="M -20 135 C 40 123, 200 123, 260 135 C 200 148, 40 148, -20 135 Z" fill="#1b5e20" />
  </g>

  <!-- Texto inferior encerrado -->
  <g transform="text-anchor: middle">
    <text x="200" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1b5e20" letter-spacing="4" text-anchor="middle">PROYECTO</text>
    <text x="200" y="315" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#388e3c" letter-spacing="10" text-anchor="middle">YUNGAS</text>
  </g>
</svg>
